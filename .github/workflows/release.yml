name: Release

# Runs only when a GitHub Release is published.
# The release's tag decides which module gets validated / packaged:
#
#   v*               driver  (module github.com/CorkCyber/athenadriver/v2)
#   athenareader/v*  CLI (cross-compiled binaries attached to the release)
#   scope/otel/v*    metrics adapters, validated only.
#   scope/tally/v*   the tag alone publishes a Go module,
#   scope/statsd/v*  there's nothing to attach.
#
# Tagging stays manual on purpose.
# The driver tag has to exist on the proxy before the sub-module tags,
# since their go.mod files require athenadriver/v2. Ordering is a human
# decision, not something the pipeline picks for you.
#
# The athenareader and adapters jobs do check for it, though.
# They query proxy.golang.org directly (GOWORK=off, bypassing this
# repo's go.work) for the exact driver version their go.mod requires.
# If it isn't published yet, the job fails loudly instead of quietly
# building against the local workspace copy and looking fine.

on:
  release:
    types: [published]

permissions: {}

jobs:
  driver:
    name: validate driver
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet
        run: go vet ./go/...
      - name: go test
        run: go test -race ./go/...

  athenareader:
    name: athenareader binaries
    if: startsWith(github.event.release.tag_name, 'athenareader/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    defaults:
      run:
        working-directory: athenareader
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: driver release must exist first
        run: |
          ver="$(grep -m1 'github.com/CorkCyber/athenadriver/v2 ' go.mod | awk '{print $2}')"
          if ! GOWORK=off GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org \
               go list -m "github.com/CorkCyber/athenadriver/v2@${ver}" >/dev/null 2>&1; then
            echo "::error::driver ${ver} isn't published on the module proxy yet; release the driver (tag ${ver}) before this package"
            exit 1
          fi
      - name: go test
        run: go test -race ./...
      - name: cross-compile
        run: |
          version="${GITHUB_REF_NAME#athenareader/}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            out="dist/athenareader-${version}-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -o "$out" .
          done
          (cd dist && shasum -a 256 athenareader-* > SHA256SUMS)
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/athenareader-* dist/SHA256SUMS

  adapters:
    name: validate adapter
    if: startsWith(github.event.release.tag_name, 'scope/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: driver release must exist first
        run: |
          moddir="$(dirname "${GITHUB_REF_NAME}")" # scope/otel/v0.1.0 -> scope/otel
          ver="$(grep -m1 'github.com/CorkCyber/athenadriver/v2 ' "$moddir/go.mod" | awk '{print $2}')"
          if ! GOWORK=off GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org \
               go list -m "github.com/CorkCyber/athenadriver/v2@${ver}" >/dev/null 2>&1; then
            echo "::error::driver ${ver} isn't published on the module proxy yet; release the driver (tag ${ver}) before this package"
            exit 1
          fi
      - name: go test
        run: |
          moddir="$(dirname "${GITHUB_REF_NAME}")" # scope/otel/v0.1.0 -> scope/otel
          cd "$moddir"
          go vet ./...
          go test -race ./...
