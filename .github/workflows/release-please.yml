name: release-please

# Semantic releases from Conventional Commits.
#
# On every push to the default branch, release-please reads commits
# since each module's last release tag and maintains one release PR
# per module: driver at ".", athenareader, and the three scope/*
# adapters. See release-please-config.json for the package list.
#
# Merging a release PR tags the module (directory-prefixed, "/"
# separated, e.g. scope/otel/v0.2.0) and publishes a GitHub Release.
# That release then triggers release.yml, for validation and, for
# athenareader, binary artifacts.
#
# Notes:
#
#   * With separate-pull-requests, every package's PR touches the same
#     .release-please-manifest.json, but only the PR whose own release
#     notes changed gets refreshed automatically — a sibling PR doesn't
#     notice when another one merges, so its manifest copy goes stale
#     and conflicts. "always-update": true in the config makes
#     release-please force-push every open release PR onto the new
#     HEAD on each push to main, so merging one PR rebases the rest
#     before you ever see a conflict.
#
#   * First releases already shipped (driver 2.0.0, athenareader 1.0.0,
#     scope/* 0.1.0) and each package's "release-as" pin has been
#     removed accordingly. A future one-off version pin belongs in a
#     `Release-As: X.Y.Z` commit footer instead of the config, since a
#     footer expires after one release and can't be forgotten the way
#     a config pin can (leave a stale pin in place and release-please
#     just re-proposes the same already-tagged version and quietly
#     skips creating the release on merge — no error, no release.yml
#     run).
#
#   * A driver major bump (3.0.0) requires a manual module-path change
#     to /v3 first. release-please bumps numbers, not import paths.
#     Gate it with a Release-As footer once the path migration lands.
#
#   * Cross-module require pins (e.g. athenareader's require on
#     athenadriver/v2) are not bumped automatically. Update them in
#     the commit that wants the newer driver.
#
#   * PRs opened with the default GITHUB_TOKEN do not trigger the CI
#     workflow. Swap the token for a PAT / GitHub App token if CI
#     must run on release PRs. Until then, re-run CI manually by
#     pushing an empty commit to the PR before merging it, or add a
#     branch protection rule requiring ci.yml's jobs to pass, which
#     does run them (branch protection isn't configured yet on this
#     repo; nothing enforces this today).

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
