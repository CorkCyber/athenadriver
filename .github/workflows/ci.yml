name: CI

on:
  push:
    branches: [master, main, "athenadriver-*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  driver:
    name: driver (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.26 is both the declared floor in go.mod and the latest release.
        go: ["1.26"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./go/... ./examples/...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -d -s ./go ./examples ./scope)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "::error::gofmt -s found unformatted files; run 'gofmt -s -w'"
            exit 1
          fi
      - name: SPDX headers
        run: |
          missing="$(grep -rL 'SPDX-License-Identifier' --include='*.go' .)"
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "::error::files above are missing the SPDX-License-Identifier header"
            exit 1
          fi
      - name: examples build
        run: go build ./examples/...
      - name: go test
        run: go test -race -coverprofile=coverage.out -coverpkg=./go/... ./go/...
      - name: coverage summary
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  athenareader:
    name: athenareader CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: athenareader/go.sum
      - name: build
        working-directory: athenareader
        run: go build ./...
      - name: vet
        working-directory: athenareader
        run: go vet ./...
      - name: test
        working-directory: athenareader
        run: go test -race ./...

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: examples/go.sum
      - name: build
        working-directory: examples
        run: go build ./...
      - name: vet
        working-directory: examples
        run: go vet ./...
      - name: test
        working-directory: examples
        run: go test -race ./...

  scope:
    name: scope adapter (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [otel, tally, statsd]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: scope/${{ matrix.adapter }}/go.sum
      - name: build
        working-directory: scope/${{ matrix.adapter }}
        run: go build ./...
      - name: vet
        working-directory: scope/${{ matrix.adapter }}
        run: go vet ./...
      - name: test
        working-directory: scope/${{ matrix.adapter }}
        run: go test -race ./...
