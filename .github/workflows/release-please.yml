name: release-please

# Semantic releases from Conventional Commits.
#
# On every push to the default branch, release-please reads commits
# since each module's last release tag and maintains one release PR
# per module: driver at ".", athenareader, and the three scope/*
# adapters. See release-please-config.json for the package list.
#
# Merging a release PR tags the module (directory-prefixed, "/"
# separated, e.g. scope/otel/v0.2.0) and publishes a GitHub Release.
# That release then triggers release.yml, for validation and, for
# athenareader, binary artifacts.
#
# Bootstrap notes (first release):
#
#   * .release-please-manifest.json is seeded at 0.0.0 for every
#     package, since no tags exist yet. release-please-config.json
#     pins each package's first release version via "release-as":
#     2.0.0 for the driver, 1.0.0 for athenareader, 0.1.0 for the
#     scope/* adapters.
#     Do NOT pre-push tags to match those versions. That recreates
#     the exact "manifest claims a version with no matching tag" bug
#     this setup was fixed to avoid. Let release-please's first PR
#     create the tags itself. Then remove each package's "release-as"
#     once its first release has shipped, or every future bump keeps
#     pinning to that same version.
#
#   * A driver major bump (3.0.0) requires a manual module-path change
#     to /v3 first. release-please bumps numbers, not import paths.
#     Gate it with a Release-As footer once the path migration lands.
#
#   * Cross-module require pins (e.g. athenareader's require on
#     athenadriver/v2) are not bumped automatically. Update them in
#     the commit that wants the newer driver.
#
#   * PRs opened with the default GITHUB_TOKEN do not trigger the CI
#     workflow. Swap the token for a PAT / GitHub App token if CI
#     must run on release PRs. Until then, re-run CI by pushing to
#     the PR, or rely on branch protection running it at merge time.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
