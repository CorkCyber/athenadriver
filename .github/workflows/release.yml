name: Release

# Runs only when a GitHub Release is published.
# The release's tag decides which module gets validated / packaged:
#
#   v*               driver  (module github.com/CorkCyber/athenadriver/v2)
#   athenareader/v*  CLI (cross-compiled binaries attached to the release)
#   scope/otel/v*    metrics adapters, validated only.
#   scope/tally/v*   the tag alone publishes a Go module,
#   scope/statsd/v*  there's nothing to attach.
#
# Tagging stays manual on purpose.
# The driver tag has to exist on the proxy before the sub-module tags,
# since their go.mod files require athenadriver/v2. Ordering is a human
# decision, not something the pipeline picks for you.
#
# The athenareader and adapters jobs do check for it, though.
# They query proxy.golang.org directly (GOWORK=off, bypassing this
# repo's go.work) for the exact driver version their go.mod requires,
# retrying for a bit since a driver tag published moments earlier can
# take a beat to show up on the proxy. If it isn't published yet, the
# job fails loudly instead of quietly building against the local
# workspace copy and looking fine. Once confirmed, they also drop the
# local replace directive before testing, so the test actually runs
# against the published driver, not the in-repo copy.

on:
  release:
    types: [published]

permissions: {}

jobs:
  unmatched-tag:
    name: unmatched release tag
    if: >-
      !startsWith(github.event.release.tag_name, 'v') &&
      !startsWith(github.event.release.tag_name, 'athenareader/v') &&
      !startsWith(github.event.release.tag_name, 'scope/')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: fail
        run: |
          echo "::error::release tag '${{ github.event.release.tag_name }}' matches none of this workflow's patterns (v*, athenareader/v*, scope/*); nothing was validated or packaged"
          exit 1

  driver:
    name: validate driver
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet
        run: go vet ./go/...
      - name: go test
        run: go test -race ./go/...

  athenareader:
    name: athenareader binaries
    if: startsWith(github.event.release.tag_name, 'athenareader/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload
    env:
      # After the preflight, go.mod's local replace is dropped so every
      # remaining step (test, cross-compile) builds against the real
      # published driver, not go.work's in-repo copy.
      GOWORK: "off"
    defaults:
      run:
        working-directory: athenareader
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: driver release must exist first
        run: |
          ver="$(grep -m1 'github.com/CorkCyber/athenadriver/v2 ' go.mod | awk '{print $2}')"
          ok=false
          for i in 1 2 3 4 5; do
            if GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org \
               go list -m "github.com/CorkCyber/athenadriver/v2@${ver}" >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 15
          done
          if [ "$ok" != true ]; then
            echo "::error::driver ${ver} isn't published on the module proxy yet; release the driver (tag ${ver}) before this package"
            exit 1
          fi
      - name: test against the published driver, not the local copy
        run: |
          go mod edit -dropreplace=github.com/CorkCyber/athenadriver/v2
          GOFLAGS=-mod=mod go mod tidy
          go test -race ./...
      - name: cross-compile
        run: |
          version="${GITHUB_REF_NAME#athenareader/}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            out="dist/athenareader-${version}-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -o "$out" .
          done
          (cd dist && shasum -a 256 athenareader-* > SHA256SUMS)
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/athenareader-* dist/SHA256SUMS

  adapters:
    name: validate adapter
    if: startsWith(github.event.release.tag_name, 'scope/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # After the preflight, go.mod's local replace is dropped so the
      # test actually runs against the published driver, not go.work's
      # in-repo copy.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: driver release must exist first
        run: |
          moddir="$(dirname "${GITHUB_REF_NAME}")" # scope/otel/v0.1.0 -> scope/otel
          ver="$(grep -m1 'github.com/CorkCyber/athenadriver/v2 ' "$moddir/go.mod" | awk '{print $2}')"
          ok=false
          for i in 1 2 3 4 5; do
            if GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org \
               go list -m "github.com/CorkCyber/athenadriver/v2@${ver}" >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 15
          done
          if [ "$ok" != true ]; then
            echo "::error::driver ${ver} isn't published on the module proxy yet; release the driver (tag ${ver}) before this package"
            exit 1
          fi
      - name: test against the published driver, not the local copy
        run: |
          moddir="$(dirname "${GITHUB_REF_NAME}")" # scope/otel/v0.1.0 -> scope/otel
          cd "$moddir"
          go mod edit -dropreplace=github.com/CorkCyber/athenadriver/v2
          GOFLAGS=-mod=mod go mod tidy
          go vet ./...
          go test -race ./...
